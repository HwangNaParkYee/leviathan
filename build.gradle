plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.h2database:h2' // H2 데이터베이스 의존성 추가
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'  // JPA 사용을 위한 의존성
	implementation 'org.springframework.boot:spring-boot-starter-web'      // 웹 애플리케이션 개발을 위한 의존성 (REST API 등)
	compileOnly 'org.projectlombok:lombok'                                 // Lombok을 컴파일 시점에만 사용하는 의존성
	runtimeOnly 'com.mysql:mysql-connector-j'                              // MySQL 연결을 위한 JDBC 드라이버 의존성 (실행 시점에만 필요)
	annotationProcessor 'org.projectlombok:lombok'                        // Lombok 어노테이션 프로세서
	testImplementation 'org.springframework.boot:spring-boot-starter-test' // 테스트를 위한 의존성
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'           // JUnit 테스트 런처

	// jwt
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'

	//security
	implementation 'org.springframework.boot:spring-boot-starter-security'
}

tasks.named('test') {
	useJUnitPlatform()
}
