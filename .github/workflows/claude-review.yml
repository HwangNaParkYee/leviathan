name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            [절대 규칙] 모든 출력은 한국어로 쓴다 - 인라인 코멘트 본문과 머리말, 최종 요약 전부.
            영어 카테고리 머리말을 쓰지 말고 아래 인라인 서식을 따른다.
            코드 식별자·경로·에러 메시지 원문만 그대로 둔다.

            이 PR을 코드 리뷰해줘.
            리눅스 온라인 저지 서비스이고, Spring Boot 3 / Java 21 멀티 모듈 프로젝트야.
            모듈: leviathan-common(공통 예외), leviathan-core(엔티티·리포지토리·서비스),
            leviathan-external(Docker·Gemini 연동), leviathan-api(컨트롤러·퍼사드·보안)
            도메인: member, problem, review, board

            리뷰 관점:
            1. **버그** - 로직 오류, null/엣지 케이스, 동시성, 트랜잭션 경계(@Transactional 안의 외부 API 호출)
            2. **모듈 경계** - api는 core의 서비스를 통해서만 DB에 접근(리포지토리·EntityManager 직접 사용 금지),
               core는 api·external을 참조하지 않음, 모듈 간 의존성은 implementation으로 선언
            3. **계층 규칙** - 컨트롤러는 XxxApi 인터페이스를 구현하고 ResponseEntity<LeviathanResponse<T>>를 반환,
               퍼사드는 ResponseEntity가 아닌 원래 타입을 반환, 실패는 문자열이 아니라 ErrorCode 기반 예외로 처리
            4. **DTO 규칙** - 요청은 controller/request, 응답은 facade/response에 record로 작성,
               엔티티를 API 응답에 직접 노출하지 않음
            5. **엔티티 규칙** - 생성자는 private/protected로 막고 정적 팩토리로 생성, setter 금지,
               상태 변경은 엔티티의 행위 메서드로
            6. **영속성** - N+1, 불필요한 조회, 유니크 제약 누락, 연관 데이터 삭제 순서
            7. **보안** - 시크릿 하드코딩, 작성자 검증 누락, 셸 명령어에 사용자 입력을 그대로 조립
            8. **코드 컨벤션** - 코드에 주석을 달지 않음(주석이 추가됐으면 지적)

            리뷰 방법:
            - diff만 보지 말고 Read로 주변 코드 확인 후 판단
            - 문제 라인에 mcp__github_inline_comment__create_inline_comment로 인라인 코멘트. 서식은 반드시
              `🔴|🟡|🟢 **한국어 제목**` 으로 시작하고 본문·수정 예시도 한국어
            - 마지막 전체 요약은 반드시 `gh pr comment`로 게시(최종 응답으로만 쓰면 아무도 못 봄)
            - 불확실하면 추측이라고 명시

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
