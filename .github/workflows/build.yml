name: 빌드 테스트

on:
  pull_request:
    paths:
      - 'leviathan-*/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  # setup-gradle 은 기본 브랜치(develop)에서 돌 때만 캐시를 저장한다
  push:
    branches: [develop]
    paths:
      - 'leviathan-*/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR 에 다시 push 하면 앞선 실행은 취소한다. develop 실행은 캐시를 저장해야 하므로 취소하지 않는다
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --exclude-task test --no-daemon

  # 의존성 그래프는 기본 브랜치(develop) 기준으로 제출한다
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
