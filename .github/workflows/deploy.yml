name: Deploy to EC2

# main 머지 → 운영 서버 배포. develop 은 배포 대상 서버가 없어 빌드(build.yml)만 한다
on:
  push:
    branches: [main]

# 배포가 겹치지 않게
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🔐 Decode and save application-build.yml
        run: |
          echo "${{ secrets.APPLICATION_YML }}" | base64 -d > leviathan-api/src/main/resources/application-build.yml

      - name: ⚙️ Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ✅ Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: 🏗️ Build Spring Boot project
        run: ./gradlew build --exclude-task test

      - name: ⬆️ Upload .jar file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicdsample
          path: leviathan-api/build/libs/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: cicdsample

      - name: 🔐 Setup SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.MY_PEM_KEY }}

      - name: ✅ Add EC2 to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 📤 SCP transfer to EC2
        run: scp -o StrictHostKeyChecking=no *-SNAPSHOT.jar ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/linuxMaster

      - name: 🚀 Run app on EC2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            sudo fuser -k 8081/tcp || true
            cd /home/ubuntu/linuxMaster
            nohup java -jar *-SNAPSHOT.jar --spring.profiles.active=build > nohup.out 2>&1 &"
