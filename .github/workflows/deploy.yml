name: Deploy Spring Boot to EC2 (with secure application.yml)

on:
  push:
    branches: [ deploy ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: ✅ Checkout source
      uses: actions/checkout@v3

    - name: ☕ Setup JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: 🛠️ Build with Gradle
      run: chmod +x gradlew ./gradlew clean build -x test

    - name: 🔐 Generate application.yml from secrets
      run: |
        mkdir -p config
        cat <<EOF > config/application.yml
        spring:
          datasource:
            url: jdbc:mysql://localhost:3306/${{ secrets.DB_NAME }}
            username: ${{ secrets.DB_USER }}
            password: ${{ secrets.DB_PASS }}
            driver-class-name: com.mysql.cj.jdbc.Driver

          jpa:
            hibernate:
              ddl-auto: update
            show-sql: true
            database-platform: org.hibernate.dialect.MySQL8Dialect
        EOF

    - name: 📦 Upload .jar to EC2
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "build/libs/*.jar"
        target: "/home/ubuntu/app"

    - name: 📄 Upload application.yml to EC2
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "config/application.yml"
        target: "/home/ubuntu/config"

    - name: 🚀 Restart Spring Boot on EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          pkill -f 'java -jar' || true
          nohup java -jar /home/ubuntu/app/*.jar --spring.config.location=file:/home/ubuntu/config/application.yml > /home/ubuntu/logs/app.log 2>&1 &

